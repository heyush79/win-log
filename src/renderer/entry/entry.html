<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Add a win</title>
    <link rel="stylesheet" href="../common.css" />
    <script src="entry.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1><label for="text">What did you do today?</label></h1>
      <p class="hint">One win per line. Add a tag if you like: #bugfix, #learning, #helped-someone.</p>
      <textarea
        id="text"
        rows="4"
        autofocus
        placeholder="Fixed the flaky login test #bugfix"
      ></textarea>
      <div class="actions">
        <span id="status" class="status" role="status"></span>
        <kbd id="save-hint"></kbd>
        <button id="save" type="button" class="primary" disabled>Save</button>
      </div>
      <section id="today-section" class="today" hidden>
        <h2>Today</h2>
        <ul id="today"></ul>
      </section>
    </main>
  </body>
</html>
