name: Bug report
description: Something in Win Log does not work as it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Please do not paste your private wins.** Issues on GitHub are public. If a win is part of the problem, write a made-up example that shows the same thing.
  - type: input
    id: version
    attributes:
      label: Win Log version
      description: Open the Win Log menu and choose "About Win Log" to see the version.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Mac
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: For example "macOS 15.1" or "Windows 11 24H2".
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong. Include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: The steps that lead to the problem, so we can try it ourselves.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Screenshots or other details that may help. Please hide or blur any private wins.
    validations:
      required: false
