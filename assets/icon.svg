<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Win Log app icon. Source for build/icon.png, build/icon.icns, build/icon.ico
    and assets/icon.png (run: npx electron scripts/make-icons.js).

    Body: 824 x 824 rounded square centred on the 1024 canvas (macOS icon grid),
    corner radius 185, warm amber gradient, soft drop shadow.
    Star: regular five-point star, outer radius 326, inner radius 124.5, centre
    (512, 534), tips rounded with radius 20 and inner corners with radius 7.
    The star's bounding box sits a few pixels above the canvas centre so it
    looks centred.

    For the Windows .ico files, scripts/make-icons.js drops the body shadow,
    crops the viewBox to the rounded square and, at 16-32 px, draws the star
    15% larger around (512, 509). It finds the parts by the body-shadow filter
    reference and id="star", so keep those as they are.
  -->
  <defs>
    <linearGradient id="body-fill" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6b13a"/>
      <stop offset="1" stop-color="#c77700"/>
    </linearGradient>
    <!-- Very soft light at the top of the body. -->
    <linearGradient id="body-sheen" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Thin light edge along the top of the body, fading out downwards. -->
    <linearGradient id="body-edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body-clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="body-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="star-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a4200" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body-fill)" filter="url(#body-shadow)"/>
  <g clip-path="url(#body-clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body-sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#body-edge)" stroke-width="3"/>
  </g>

  <path id="star" filter="url(#star-shadow)" fill="#fff" d="M493 266.5A20 20 0 0 1 531 266.5L583.6 428.4A7 7 0 0 0 590.3 433.3L760.5 433.3A20 20 0 0 1 772.2 469.4L634.5 569.5A7 7 0 0 0 632 577.3L684.6 739.2A20 20 0 0 1 653.8 761.6L516.1 661.5A7 7 0 0 0 507.9 661.5L370.2 761.6A20 20 0 0 1 339.4 739.2L392 577.3A7 7 0 0 0 389.5 569.5L251.8 469.4A20 20 0 0 1 263.5 433.3L433.7 433.3A7 7 0 0 0 440.4 428.4Z"/>
</svg>
